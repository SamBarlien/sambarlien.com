- title: "The future of AI-native is open source"
  take: "NVIDIA and AMD opening up their AI software layers gives platform teams capability, not lock-in. I compare a production stack built on each and set out five tests for judging an opinionated AI stack."
  url: "https://weaveintelligence.io/research/the-future-of-ai-native-is-open-source"
  date: "2026-09-28"
  highlight: false

- title: "State of AI in Platform Engineering 2026"
  take: "38% of organisations now ship twice as much since AI, but only 8% see a real return. Our data says the bottleneck is the platform, not the model."
  with: ["Luca Galante", "Florian Lipp"]
  url: "https://weaveintelligence.io/research/state-of-ai-in-platform-engineering-2026"
  date: "2026-09-17"
  highlight: true

- title: "Platform engineering 2.0: An evolution for the AI era"
  take: "Platform engineering for AI is an evolution, not a revolution. The Internal Developer Platform becomes an Agentic Development Platform on the same operating model, and I set out the five pillars to get there."
  with: ["Pankaj Gupta"]
  url: "https://platformengineering.org/reports/platform-engineering-2-0-an-evolution-for-the-ai-era"
  date: "2026-06-16"
  highlight: true

- title: "Operationalizing AI coding agents in regulated industries"
  take: "Autonomous coding agents break the governance banks and governments rely on, and IDE-level controls won't fix it. I argue the workspace is the right control surface: policy as code, audit trails and clear limits on what each agent can do."
  url: "https://weaveintelligence.io/research/operationalizing-ai-coding-agents-in-regulated-industries"
  date: "2026-03-26"
  highlight: false

- title: "The great unlock: How platform engineering creates AI-native enterprises"
  take: "Most enterprises are stuck between AI pilots and production. I explain the difference between AI-enabled and AI-native, and why platform engineering is the operating model that gets you from one to the other."
  url: "https://weaveintelligence.io/research/the-great-unlock-how-platform-engineering-creates-ai-native-enterprises"
  date: "2026-03-16"
  highlight: false

- title: "Vulnerability management for platform engineers"
  take: "\"Shift left\" turned fixing CVEs into a tax on every developer. Security should shift down into the platform, and I lay out the four capabilities that make that work."
  url: "https://weaveintelligence.io/research/vulnerability-management-for-platform-engineers"
  date: "2026-02-02"
  highlight: false

